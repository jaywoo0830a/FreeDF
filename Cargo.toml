[workspace]
resolver = "2"
members = [
    "crates/freedf-canvas",
    "crates/freedf-core",
    "crates/freedf",
    "crates/freedf-gui",
    "crates/freedf-services",
    "crates/freedf-sync",
    "crates/freedf-theme",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# freedf-canvas는 **무의존성**(100% std) 크레이트 — 순수성/결정성 보장.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 에러 처리 — 라이브러리 크레이트(freedf-core/canvas)는 thiserror로 타입화된
# 에러를, 앱 경계(크레이트 밖 · 통합 테스트)는 anyhow로 수렴합니다.
# (docs: crates/freedf-core/src/error.rs 모듈 문서의 3계층 에러 바운더리 정책)
thiserror = "2"
anyhow = "1"
egui = "0.36"
# eframe 0.36 기본 렌더러는 wgpu(DX12) — 일부 Windows에서 시작 시 0xc0000005 크래시.
# 호환성이 좋은 OpenGL(glow) 백엔드를 기본으로 사용하되, GPU 오프로드를 원하면
# `FREEDF_RENDERER=wgpu` 환경 변수로 DirectX 12 백엔드를 선택할 수 있습니다.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "accesskit", "links", "x11", "wayland"] }
pdfium-render = "0.9.3"
# eguidev — egui 앱용 인프로세스 GUI 자동화/계측 (Playwright의 GUI판).
# 공식 크레이트는 아직 egui 0.35까지만 발행되어 있어(FreeDF는 egui 0.36),
# 리비전을 고정한 포크를 씁니다. 포크 브랜치 `freedf`는 저자 로컬 경로 의존성을
# 공개 리비전으로 바꾸고 비공개 `ruau-script-api` 의존성을 걷어낸 것뿐입니다.
# `crates/freedf`의 `dev-automation` 기능에서만 실제로 링크됩니다.
eguidev = { git = "https://github.com/jaywoo0830a/eguidev", rev = "84ab2da60b36fa5f4235c0792b78e5535b95700a" }
eguidev_runtime = { git = "https://github.com/jaywoo0830a/eguidev", rev = "84ab2da60b36fa5f4235c0792b78e5535b95700a" }
# elm-magic — JSX 스타일 순수 함수형 UI 매크로 + egui 어댑터 (freedf-gui 셸 · freedf PoC 모달).
# 0.5.0부터 crates.io에 발행되어 **리비전 핀 → 버전 의존**으로 전환했습니다.
# 0.5.0이 `docs/elm-magic-bug-report.md`의 3건(=`pub fn` vis · `remove(x)` 뒤 문장
# 구분자 · 지역 컬렉션 `.iter().map()` E0716)을 수정해 freedf-gui의 워크어라운드가
# 필요 없어졌습니다. (리비전 핀 시절: `14f11eb9…` — 이전 워크어라운드의 근거.)
elm-magic = "0.5.0"
elm-magic-egui = "0.5.0"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
