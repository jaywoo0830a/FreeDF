[workspace]
resolver = "2"
members = [
    "crates/freedf-core",
    "crates/freedf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.36"
eframe = "0.36"
pdfium-render = "0.9.3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
