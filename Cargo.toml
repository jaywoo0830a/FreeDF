[workspace]
resolver = "2"
members = [
    "crates/freedf-core",
    "crates/freedf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.36"
# eframe 0.36 기본 렌더러는 wgpu(DX12) — 일부 Windows에서 시작 시 0xc0000005 크래시.
# 호환성이 좋은 OpenGL(glow) 백엔드를 기본으로 사용합니다.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "links", "x11", "wayland"] }
pdfium-render = "0.9.3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
