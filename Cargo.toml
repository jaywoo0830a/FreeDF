[workspace]
resolver = "2"
members = [
    "crates/freedf-canvas",
    "crates/freedf-core",
    "crates/freedf",
    "crates/freedf-gui",
    "crates/freedf-services",
    "crates/freedf-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# freedf-canvas는 **무의존성**(100% std) 크레이트 — 순수성/결정성 보장.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.36"
# eframe 0.36 기본 렌더러는 wgpu(DX12) — 일부 Windows에서 시작 시 0xc0000005 크래시.
# 호환성이 좋은 OpenGL(glow) 백엔드를 기본으로 사용하되, GPU 오프로드를 원하면
# `FREEDF_RENDERER=wgpu` 환경 변수로 DirectX 12 백엔드를 선택할 수 있습니다.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "accesskit", "links", "x11", "wayland"] }
pdfium-render = "0.9.3"
# eguidev — egui 앱용 인프로세스 GUI 자동화/계측 (Playwright의 GUI판).
# 공식 크레이트는 아직 egui 0.35까지만 발행되어 있어(FreeDF는 egui 0.36),
# 리비전을 고정한 포크를 씁니다. 포크 브랜치 `freedf`는 저자 로컬 경로 의존성을
# 공개 리비전으로 바꾸고 비공개 `ruau-script-api` 의존성을 걷어낸 것뿐입니다.
# `crates/freedf`의 `dev-automation` 기능에서만 실제로 링크됩니다.
eguidev = { git = "https://github.com/jaywoo0830a/eguidev", rev = "84ab2da60b36fa5f4235c0792b78e5535b95700a" }
eguidev_runtime = { git = "https://github.com/jaywoo0830a/eguidev", rev = "84ab2da60b36fa5f4235c0792b78e5535b95700a" }
# elm-magic — JSX 스타일 순수 함수형 UI 매크로 + egui 어댑터 (PoC: fallback_dialog 본문).
# 아직 crates.io에 발행되지 않은 실험 단계라 리비전을 고정합니다 (eguidev와 동일 방식).
elm-magic = { git = "https://github.com/jaywoo0830a/elm-magic", rev = "14f11eb928913acfe7438ab87aa654f27d9d63df" }
elm-magic-egui = { git = "https://github.com/jaywoo0830a/elm-magic", rev = "14f11eb928913acfe7438ab87aa654f27d9d63df" }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
