server {
    listen 0.0.0.0:8081;            # Caddy가 host-gateway로 도달 (80/443은 Caddy 몫)
    server_name freedf.rlawjddn00.inline;
    client_max_body_size 200m;

    location /media/ {
        alias /srv/freedf-server/media/;
        add_header Cache-Control "private, max-age=31536000, immutable";
        proxy_force_ranges on;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /v3/ {                 # ← 누락돼 있던 Sync v3
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}