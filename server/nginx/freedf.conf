# FreeDF — 1Gbps 서버용 nginx 서버 블록 (server/docker-compose.yml 이
# /etc/nginx/conf.d/default.conf 로 마운트합니다).
#
# 흐름: Caddy(80/443, HTTP/3) → nginx(0.0.0.0:8081) → backend(127.0.0.1:8080)
# - /media/*  : 디스크 직접 서빙 (Range 스트리밍, sendfile, 오픈 파일 캐시)
# - /api, /v3 : backend 로 keep-alive 프록시 (버퍼링 없이 스트리밍)
server {
    listen 0.0.0.0:8081;            # Caddy가 host-gateway로 도달 (80/443은 Caddy 몫)
    server_name freedf.rlawjddn00.online;
    client_max_body_size 200m;

    # Caddy까지 평문 전송이므로 http 레벨 gzip은 여기서 비활성 (미디어/대용량에
    # 불필요한 CPU·지연 제거. 브라우저 압축은 Caddy가 HTTP/3 종료부에서 담당).
    gzip off;

    # ── /media/* — 정적 파일 직접 서빙 (Range 스트리밍) ─────────────────────
    location /media/ {
        alias /srv/freedf-server/media/;
        add_header Cache-Control "private, max-age=31536000, immutable";
        proxy_force_ranges on;      # Range 재개/탐색 지원
        sendfile on;
        # 커널/디스크에서 파일 핸들과 메타데이터를 캐시 → 반복 조회 비용 제거.
        open_file_cache max=20000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # ── /api + /v3 — backend 로 keep-alive 프록시 ──────────────────────────
    location ~ ^/(api|v3)/ {
        proxy_pass http://freedf_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1Gbps 대용량(스냅샷/미디어/multipart ~200MB) 예산 — 커넥트는 빨리 실패.
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 버퍼링 off → 백엔드 응답/요청을 즉시 양방향 스트리밍 (첫 바이트 지연 ↓,
        # 대용량에서 nginx 디스크 버퍼링 없이 1Gbps 활용). media는 여기 안 지나감.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }

    # ── /health — 앱의 "Test connection" (키 없이 200) ─────────────────────
    location = /health {
        proxy_pass http://freedf_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}