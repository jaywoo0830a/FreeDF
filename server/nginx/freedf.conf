# 업로드 최대 크기 200MB (녹음 파일 여유)
server {
    listen 80;
    server_name media.example.com;
    # TLS 전환 전까지 HTTP로도 응답 (또는 아래 주석 해제해 443 리다이렉트)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name media.example.com;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    client_max_body_size 200m;

    # ── 미디어 직접 서빙 — Range/스트리밍은 nginx 기본 지원 ──
    location /media/ {
        alias /srv/freedf-server/media/;
        add_header Cache-Control "private, max-age=31536000, immutable";
        # Range 요청(오디오 탐색) 허용 확인용
        proxy_force_ranges on;
    }

    # ── 백엔드 API (업로드/목록/삭제) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
