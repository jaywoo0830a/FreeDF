# FreeDF — 1Gbps 서버용 nginx 메인 설정 (server/docker-compose.yml 이 이 파일을
# /etc/nginx/nginx.conf 로 마운트합니다).
#
# 커널은 호스트에서 이미 튜닝됨(중복 sysctl 금지). 여기서는 nginx 스스로가
# 1Gbps 링크를 최대로 활용하도록 프로세스/커넥션/전송 버퍼를 조정합니다.

# 워커 = CPU 코어 수 (listener는 epoll, 연결은 스레드로 분산).
worker_processes auto;
worker_rlimit_nofile 131072;   # worker_connections × 커널 fd 상한
user nginx;
pid /var/run/nginx.pid;

events {
    # 1Gbps에서 많은 동시 미디어 스트림/요청 처리 — 알파인 기본(1024) 대비 대폭 상향.
    worker_connections 8192;
    multi_accept on;           # 한 스레드가 여럿을 동시에 받기
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 정적 파일(미디어)을 커널 sendfile로 직접 전송 → 복사 0번, 1Gbps 활용.
    sendfile on;
    tcp_nopush on;             # 패킷 채워 전송 (큰 파일에 효율)
    tcp_nodelay on;            # 작은 API 응답은 즉시 (지연 방지)

    keepalive_timeout 75s;
    keepalive_requests 10000;  # keep-alive 커넥션 재사용 극대화
    types_hash_max_size 4096;
    server_tokens off;         # 버전 노출 제거
    client_max_body_size 200m; # 미디어 업로드 상한

    # 업스트림(backend 127.0.0.1:8080) keep-alive 풀 — 폴링/연속 요청 시
    # 매번 TCP 핸드셰이크를 생략 (Sync v3는 250ms 폴링).
    upstream freedf_backend {
        server 127.0.0.1:8080;
        keepalive 128;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time uconn=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 텍스트류만 압축 — 미디어(이미지/오디오/비디오)는 이미 압축돼 있고
    # Range 스트리밍(/media)과 상충하므로 포함하지 않음.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/json application/javascript application/xml
               application/xml+rss text/css text/plain text/xml;

    include /etc/nginx/conf.d/*.conf;
}