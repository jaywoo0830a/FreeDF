[package]
name = "freedf-media-server"
version = "0.1.0"
edition = "2021"

# 루트 FreeDF 워크스페이스와 분리된 독립 프로젝트.
[workspace]

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
