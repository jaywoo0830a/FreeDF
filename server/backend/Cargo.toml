[package]
name = "freedf-media-server"
version = "0.1.0"
edition = "2021"

# 루트 FreeDF 워크스페이스와 분리된 독립 프로젝트.
[workspace]

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
# Sync v3 프로토콜 타입·ZIP 코덱을 클라이언트(freedf-sync)와 공유.
freedf-sync = { path = "../../crates/freedf-sync", default-features = false }
