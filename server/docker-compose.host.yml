# Linux Docker Engine(VPS) 전용 오버레이 — backend를 호스트 네트워크로.
# DB(127.0.0.1:5432)와 nginx(127.0.0.1:8080)를 같은 호스트 루프백에서 직통.
# (브리지의 host-gateway는 127.0.0.1 전용 바인딩에 연결 거부 — Linux Engine 불가)
services:
  backend:
    network_mode: host
    environment:
      # 호스트 루프백에만 바인딩 — nginx(호스트 네트워크)만 접근.
      BIND: "127.0.0.1:8080"
      # 호스트 루프백의 PostgreSQL 직통 (up.sh가 server/db/.env 기반으로 조립).
      DATABASE_URL: ${HOST_DB_URL:-postgres://freedf:freedf@127.0.0.1:5432/freedf}