# FreeDF — PostgreSQL 18.6 튜닝 설정 (Ubuntu + SSD, 도커)
# 공식 문서: https://www.postgresql.org/docs/18/runtime-config.html
#
# 이 파일은 `-c config_file=...` 로 지정됩니다.
# data_directory/hba_file/ident_file은 **여기서 지정하지 않음** —
# 공식 이미지의 PGDATA(/var/lib/postgresql/18/docker) 환경 변수가
# 자동으로 기준이 됩니다 (경로 하드코딩 금지 — 이미지 레이아웃 변경에 취약).
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'

# ── 메모리 (아래는 호스트 RAM 8GB 기준 — 서버 사양에 맞춰 조정) ──
shared_buffers = 1GB                # RAM의 ~25% (기본 128MB)
effective_cache_size = 4GB          # OS 페이지캐시 포함 추정치 (플래너 힌트)
work_mem = 16MB                     # 정렬/해시 1회 작업 메모리
maintenance_work_mem = 512MB        # VACUUM/인덱스 생성용
wal_buffers = 64MB

# ── WAL / 체크포인트 (SSD) ──
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9  # 체크포인트를 넓게 분산 (쓰기 스파이크 방지)
wal_compression = zstd              # WAL 압축 — SSD 쓰기 증폭과 대역폭 절약 (PG15+)
# synchronous_commit = off          # 필기 응답성 우선 시 — 크래시 직전 커밋 유실 허용
synchronous_commit = on             # 기본: 내구성 우선 (노트 데이터)

# ── SSD I/O ──
random_page_cost = 1.1              # SSD: 시퀀스/랜덤 비용 격차 축소 (기본 4.0은 HDD용)
effective_io_concurrency = 200      # SSD 큐 깊이 — 읽기 선행(prefetch) 강화
io_method = worker                  # PG18 내장 비동기 I/O (워커 프로세스 풀)
# io_direct = data                  # 커널 페이지캐시 우회 실험용 (기본 off)

# ── 압축 / 연결 ──
default_toast_compression = lz4     # BYTEA(문서 PDF 본문) TOAST 압축
max_connections = 100
wal_level = replica                 # 기본값 명시
max_wal_senders = 0                 # 단일 인스턴스 — 복제 안 씀 (WAL 절약)

# ── 통계 / 모니터링 ──
track_io_timing = on
# 쿼리 통계가 필요하면 주석 해제 (공식 이미지에 contrib 포함됨):
# shared_preload_libraries = 'pg_stat_statements'
# pg_stat_statements.max = 1000

# ── 자동 VACUUM ──
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
