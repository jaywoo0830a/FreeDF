[package]
name = "freedf-gui"
version.workspace = true
edition.workspace = true
description = "FreeDF GUI — elm-magic으로 처음부터 다시 만드는 UI 셸 (PoC)"
default-run = "freedf-gui"

# 화면/엔진/스타일은 라이브러리(`src/lib.rs`), eframe 진입점만 바이너리.
# 테스트는 `tests/`에서 라이브러리의 공개 API로 검증한다 (크레이트 관례).
[lib]
name = "freedf_gui"
path = "src/lib.rs"

[[bin]]
name = "freedf-gui"
path = "src/main.rs"

[features]
# AI/에이전트가 freedf-gui GUI를 직접 보고 조작하기 위한 eguidev 계측.
#   cargo run -p freedf-gui --features dev-automation
# EGUIDEV_MCP_ADDR 주입이 없는 실행에선 완전 no-op입니다.
dev-automation = ["dep:eguidev", "dep:eguidev_runtime"]

[dependencies]
eframe.workspace = true
egui.workspace = true
# UI는 전부 elm-magic(view!)으로 그린다 — egui 어댑터가 Element 트리를 위젯으로 렌더.
elm-magic.workspace = true
elm-magic-egui.workspace = true
# Phase 1 (docs/freedf-gui-migration.md) — 저장소/동기화/PDF/설정 서비스 계층 공유.
freedf-services = { path = "../freedf-services" }
# Phase 2 — 캔버스: 잉크 메시(freedf-canvas) + 모델/저장소/변환(freedf-core).
freedf-canvas = { path = "../freedf-canvas" }
freedf-core = { path = "../freedf-core" }
# 스타일: freedf-theme 의존 **없음** — elm-magic 0.6 CSS 속성(`src/style.rs`의
# `css!` 규칙 + `Palette` 토큰)만으로 표현한다 (구 테마 설치기는 freedf 전용).
# 잉크 기본값 저장/복원 (설정 창 — app_data_dir의 JSON 파일).
serde.workspace = true
serde_json.workspace = true

# eguidev 계측/런타임 — `dev-automation` 기능에서만 링크됩니다 (워크스페이스 핀 고정).
eguidev = { workspace = true, optional = true }
eguidev_runtime = { workspace = true, optional = true }
