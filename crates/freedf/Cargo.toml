[package]
name = "freedf"
version.workspace = true
edition.workspace = true
description = "FreeDF — 초경량 Windows 11 친화적 PDF 뷰어 + 드로잉 패드 (egui 0.36 + pdfium-render 0.9.3)"
default-run = "freedf"

[[bin]]
name = "freedf"
path = "src/main.rs"

[dependencies]
freedf-core = { path = "../freedf-core" }
eframe.workspace = true
egui.workspace = true
pdfium-render.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows에서는 기본 OS 파일 대화상자를 사용합니다.
[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"
