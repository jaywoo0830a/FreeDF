[package]
name = "freedf"
version.workspace = true
edition.workspace = true
description = "FreeDF — 초경량 Windows 11 친화적 PDF 뷰어 + 드로잉 패드 (egui 0.36 + pdfium-render 0.9.3)"
default-run = "freedf"

[[bin]]
name = "freedf"
path = "src/main.rs"

[dependencies]
freedf-core = { path = "../freedf-core" }
# 캔버스(잉크 메시) 파이프라인 — 순수 계산 레이어 (doc/architecture.md).
freedf-canvas = { path = "../freedf-canvas" }
# Sync v3 프로토콜 전용 객체 (Snapshot/Patch/SyncClient) — 서버와 공유.
freedf-sync = { path = "../freedf-sync" }
eframe.workspace = true
egui.workspace = true
pdfium-render.workspace = true
serde.workspace = true
serde_json.workspace = true
# 사전 오버레이 조회 (dictionaryapi.dev, 동기 HTTP)
ureq = { version = "2", features = ["json"] }
# Phosphor icons for egui (only the regular style to keep the binary small)
egui_phosphor_icons = { version = "0.5", default-features = false }
# WAV 파일 저장 (순수 Rust — 녹음 출력)
hound = "3"
# 이미지 미리보기 디코딩 (PNG/JPEG/GIF/WebP/BMP — 서버에서 받은 사진 미리보기)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Windows에서는 기본 OS 파일 대화상자를 사용합니다.
[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"
# 매크로 출력 — enigo 키 주입 (Windows는 SendInput 기반).
# 입력은 egui 이벤트를 씁니다 (화상 키보드는 LL 훅을 우회하므로).
enigo = "0.6"
# 전역 데스크탑 리스너 (Activate on focus 꺼짐 — 비포커스에서도 q/w 감지).
rdev = "0.5"
# 전경(foreground) 검사 — 포커스 모드에서 전역 리스너의 이중 주입 방지.
# DWM — 네이티브 창 스타일(다크 타이틀바/라운드 코너/Mica).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_XboxController",
    "Win32_Graphics_Dwm",
] }
# winit 창 → OS hwnd 추출 (winstyle 적용용).
raw-window-handle = "0.6"

# 마이크 캡처 — Windows(WASAPI)/macOS(CoreAudio)에서 자동 포함.
# Linux는 ALSA dev 패키지(libasound2-dev)가 필요해 기본 빌드에서 제외됩니다.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.15"
# 인앱 오디오 재생 (rodio — 내부적으로 cpal 사용).
rodio = "0.18"
