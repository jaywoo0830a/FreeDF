[package]
name = "freedf"
version.workspace = true
edition.workspace = true
description = "FreeDF — 초경량 Windows 11 친화적 PDF 뷰어 + 드로잉 패드 (egui 0.36 + pdfium-render 0.9.3)"
default-run = "freedf"
build = "build.rs"

[[bin]]
name = "freedf"
path = "src/main.rs"

[features]
# AI/에이전트가 FreeDF GUI를 직접 보고 조작하기 위한 eguidev 인프로세스 계측.
#   cargo run -p freedf --features dev-automation
# 실제 자동화 서버는 EDEV 런처가 EGUIDEV_MCP_ADDR을 주입한 실행에서만 켜집니다
# (그 외에는 완전한 no-op — 일반 실행의 동작/성능에 영향이 없습니다).
dev-automation = ["dep:eguidev", "dep:eguidev_runtime"]

[dependencies]
freedf-core = { path = "../freedf-core" }
# 캔버스(잉크 메시) 파이프라인 — 순수 계산 레이어 (doc/architecture.md).
freedf-canvas = { path = "../freedf-canvas" }
# Sync v3 프로토콜 전용 객체 (Snapshot/Patch/SyncClient) — 서버와 공유.
freedf-sync = { path = "../freedf-sync" }
# Phase 1 (docs/freedf-gui-migration.md) — 서비스 계층(storage/sync/server/pdf/
# settings/recent/recording/player)은 freedf-services 크레이트로 이동했고, 이
# 크레이트는 아래 셔임 모듈로 기존 `crate::*` 경로를 유지합니다.
freedf-services = { path = "../freedf-services" }
# 디자인 토큰/Nord 테마 + egui Style/Visuals 설치기 — **freedf 전용**.
# (freedf-gui는 elm-magic 0.6 CSS 속성으로 자체 스타일을 정의해 이 크레이트를
#  더 이상 쓰지 않는다 — docs/freedf-gui-migration.md의 CSS 전환 항목 참고.)
freedf-theme = { path = "../freedf-theme" }
eframe.workspace = true
egui.workspace = true
pdfium-render.workspace = true
serde.workspace = true
serde_json.workspace = true
# 사전 오버레이 조회 (dictionaryapi.dev, 동기 HTTP)
ureq = { version = "2", features = ["json"] }
# Phosphor icons for egui (only the regular style to keep the binary small)
egui_phosphor_icons = { version = "0.5", default-features = false }
# 이미지 미리보기 디코딩 (PNG/JPEG/GIF/WebP/BMP — 서버에서 받은 사진 미리보기)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# eguidev 계측/런타임 — `dev-automation` 기능에서만 링크됩니다 (워크스페이스 핀 고정).
eguidev = { workspace = true, optional = true }
eguidev_runtime = { workspace = true, optional = true }
# elm-magic PoC — fallback_dialog 본문을 `view!`로 렌더링 (ui/elm_modal.rs 참고).
elm-magic.workspace = true
elm-magic-egui.workspace = true

# Windows에서는 기본 OS 파일 대화상자를 사용합니다.
[target.'cfg(target_os = "windows")'.dependencies]
rfd = "0.15"
# 매크로 출력 — enigo 키 주입 (Windows는 SendInput 기반).
# 입력은 egui 이벤트를 씁니다 (화상 키보드는 LL 훅을 우회하므로).
enigo = "0.6"
# 전역 데스크탑 리스너 (Activate on focus 꺼짐 — 비포커스에서도 q/w 감지).
rdev = "0.5"
# 전경(foreground) 검사 — 포커스 모드에서 전역 리스너의 이중 주입 방지.
# DWM — 네이티브 창 스타일(다크 타이틀바/라운드 코너/Mica).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }
# 게임패드 — gilrs의 WGI(Windows.Gaming.Input) 백엔드.
# XInput보다 넓은 기기 지원(Xbox 외 DualSense·8BitDo 등 WGI 패드).
gilrs = "0.11"
# winit 창 → OS hwnd 추출 (winstyle 적용용).
raw-window-handle = "0.6"

# 마이크 캡처(cpals)/재생(rodio)은 freedf-services 크레이트로 이동했습니다.

# Windows 전용 빌드-시간 리소스 임베드 (.exe 자체 아이콘 — 바탕화면/탐색기/
# 작업 관리자에서 사용). build.rs → embed-resource 가 win/app.rc 를 컴파일해
# PE 실행 파일에 Group Icon 리소스로 링크합니다. 런타임 Windows API 불필요.
# (build.rs 는 #[cfg(windows)] 로 게이트되므로 Linux 빌드에는 영향 없음.)
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"
